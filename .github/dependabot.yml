version: 2
updates:
  # The pipeline pins every action to a major version.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: terraform
    directory: "/terraform"
    schedule:
      interval: monthly
    commit-message:
      prefix: "infra"

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
