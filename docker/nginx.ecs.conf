# AutoDeployX — nginx config for the ECS task.

upstream api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# JSON access log so CloudWatch Logs Insights can query it as fields instead of
# regex-scraping a text line.
map $http_x_request_id $correlation_id {
    default   $http_x_request_id;
    ""        $request_id;
}

# Load shedding. One task, one db.t3.micro, ~87 connections: the service has a hard
# ceiling and will meet it before the ALB notices anything is wrong.
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn_perip:10m;

log_format json_combined escape=json '{'
    '"time":"$time_iso8601",'
    '"correlation_id":"$correlation_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"user_agent":"$http_user_agent"'
'}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Real client IP for logs — ALB puts it in X-Forwarded-For.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/16;

    access_log /var/log/nginx/access.log json_combined;

    # --- Response headers --------------------------------------------- `always`
    # matters: without it nginx omits these on error responses, which are exactly
    # the responses an attacker is trying.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Neither frontend loads third-party script, style or font. If that stops
    # being true the console tells you immediately, which is the point: a CSP
    # that is never violated is a CSP nobody has checked.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # nginx's own liveness, answered without touching the API. Used by the
    # container HEALTHCHECK only — the ALB checks /api/health, which is
    # deliberately the deeper check.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /version.txt {
        access_log off;
        add_header Content-Type text/plain;
    }

    location /api/ {
        # Only the API is rate limited. Static assets are served from local
        # disk and cost nothing; throttling them would break a legitimate page
        # load, which fetches a dozen files at once.
        limit_req zone=perip burst=40 nodelay;
        limit_conn conn_perip 24;

        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward the correlation id so the application can put it on its own
        # log lines, and return it so a client can quote it in a bug report.
        proxy_set_header X-Request-ID $correlation_id;

        # add_header in a location REPLACES the inherited set rather than adding to
        # it, so introducing X-Request-ID here would silently drop every security
        # header from every API response.
        add_header X-Request-ID $correlation_id always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # API responses are JSON, never a document — so the CSP that matters is
        # the one that stops a browser being tricked into rendering one.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        # The ALB gives up at 30s (idle timeout). Failing here first produces a
        # 504 from nginx with an upstream_time in the log, which is far easier
        # to diagnose than a bare ALB 504 with no request context.
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
    }

    # Hashed Vite assets are content-addressed, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html must never be cached, or a deploy ships new asset hashes that
    # nobody's browser asks for.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # Client-side routing: unknown paths fall through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
